    <g transform="translate(80,214)"><rect width="480" height="110" rx="10" fill="#10172a" stroke="#2a3a5c" stroke-width="1.5"/><text x="24" y="40" font-size="16" fill="#8aa0c6">"$1,000 trading credit"</text><text x="24" y="80" font-family="Georgia,serif" font-size="23" font-weight="800" font-style="italic" fill="#fff">only "once it activates"</text></g>
    <g transform="translate(640,214)"><rect width="480" height="110" rx="10" fill="#10172a" stroke="#2a3a5c" stroke-width="1.5"/><text x="24" y="40" font-size="16" fill="#8aa0c6">14-day countdown</text><text x="24" y="80" font-family="Georgia,serif" font-size="23" font-weight="800" font-style="italic" fill="#fff">nothing to trade yet</text></g>
  </g>
  <text x="600" y="372" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-size="17" fill="#ff8a7a" letter-spacing="1">AND THE "NO EXTENSIONS" CODE, ONE DAY APART:</text>
  <g>
