  <rect x="0" y="560" width="1200" height="70" fill="#c62828"/>
  <text x="600" y="605" text-anchor="middle" font-family="DM Sans,Segoe UI,sans-serif" font-size="22" fill="#fff" letter-spacing="1" font-weight="800">THE EMAIL'S OWN INSTRUCTION: "STILL OVERTHINKING? DON'T."</text>
