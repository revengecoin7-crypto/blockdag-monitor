  <text x="118" y="60" font-family="DM Sans,Segoe UI,sans-serif" font-size="26" font-weight="800" fill="#fff">BlockDAG <tspan fill="#ff6b6b" font-style="italic">Exposed</tspan></text>
  <text x="600" y="128" text-anchor="middle" font-family="Georgia,'Newsreader',serif" font-size="38" font-weight="800" font-style="italic" fill="#fff">The "fully regulated exchange"</text>
  <text x="600" y="176" text-anchor="middle" font-family="Georgia,'Newsreader',serif" font-size="38" font-weight="800" font-style="italic" fill="#ff6b6b">is a sign-up form.</text>
