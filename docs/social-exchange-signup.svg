    <text x="104" y="490" font-family="Georgia,'Newsreader',serif" font-size="20" font-style="italic" fill="#fff">Gone for good."</text>
    <rect x="640" y="392" width="480" height="120" rx="10" fill="#2a0808" stroke="#c62828" stroke-width="2"/>
